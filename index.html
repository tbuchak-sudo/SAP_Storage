        /**

         */
        class AppState {
            constructor() {
                this.storageKey = 'sap_storage_lms_v3';
                this.state = this.loadState();
            }

            loadState() {
                try {
                    const raw = localStorage.getItem(this.storageKey);
                    if (!raw) return this.getDefaultState();
                    const parsed = JSON.parse(raw);
                    
                    // Validate existing module IDs to prevent fake module injection
                    const validModules = {};
                    if (parsed.modules && typeof parsed.modules === 'object') {
                        AppData.modules.forEach(m => {
                            if (parsed.modules[m.id] === true) {
                                validModules[m.id] = true;
                            }
                        });
                    }
                    return {
                        modules: validModules,
                        scores: parsed.scores || {},
                        version: 3,
                        updatedAt: new Date().toISOString()
                    };
                } catch (e) {
                    return this.getDefaultState();
                }
            }

            getDefaultState() {
                return {
                    modules: {},
                    scores: {},
                    version: 3,
                    updatedAt: new Date().toISOString()
                };
            }

            saveState() {
                this.state.updatedAt = new Date().toISOString();
                localStorage.setItem(this.storageKey, JSON.stringify(this.state));
                this.notifyUI();
            }

            completeModule(moduleId, score) {
                this.state.modules[moduleId] = true;
                if (score !== undefined) {
                    this.state.scores[moduleId] = score;
                }
                this.saveState();
            }

            isModuleCompleted(moduleId) {
                return !!this.state.modules[moduleId];
            }

            getProgressPercentage() {
                const total = AppData.modules.length;
                if (total === 0) return 0;
                const completed = AppData.modules.filter(m => this.state.modules[m.id] === true).length;
                return Math.min(Math.round((completed / total) * 100), 100);
            }

            resetProgress() {
                this.state = this.getDefaultState();
                this.saveState();
            }

            notifyUI() {
                const percent = this.getProgressPercentage();
                const bar = document.getElementById('progress-bar');
                const text = document.getElementById('progress-text');
                if (bar) bar.style.width = `${percent}%`;
                if (text) text.innerText = `${percent}%`;
            }

        /**
         * 4. ROUTER LAYER
         */
        class Router {
            constructor(rootElement, stateManager) {
                this.root = rootElement;
                this.state = stateManager;
                
                this.routes = [
                    { path: /^#home$/, render: () => Components.Home(this.state) },
                    { path: /^#training$/, render: () => Components.Training(this.state) },
                    { path: /^#directory$/, render: () => Components.Directory() },
                    { path: /^#procedures$/, render: () => Components.ProceduresList() },
                    { 
                        path: /^#sap\/([a-z0-9_]+)$/i, 
                        render: (matches) => {
                            const modId = matches[1].toLowerCase();
                            const module = AppData.modules.find(m => m.id.toLowerCase() === modId);
                            return module ? Components.ModuleDetail(module, this.state) : Components.NotFound();
                        }
                    },
                    { 
                        path: /^#procedures\/([a-z0-9_]+)$/i, 
                        render: (matches) => {
                            const procId = matches[1].toLowerCase();
                            const proc = AppData.procedures.find(p => p.id.toLowerCase() === procId);
                            return proc ? Components.ProcedureDetail(proc) : Components.NotFound();
                        }
                    }
                ];

                window.addEventListener('hashchange', () => this.navigate());
            }

            navigate() {
                const hash = window.location.hash || '#home';
                let matched = false;

                this.updateActiveNav(hash);

                for (let route of this.routes) {
                    const match = hash.match(route.path);
                    if (match) {
                        this.root.innerHTML = route.render(match);
                        matched = true;
                        break;
                    }
                }

                if (!matched) {
                    this.root.innerHTML = Components.NotFound();
                }

                window.scrollTo(0, 0);
                this.closeMobileSidebar();
            }

            updateActiveNav(hash) {
                const baseRoute = hash.split('/')[0].replace('#', '');
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.dataset.path === baseRoute) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }

            closeMobileSidebar() {
                const sidebar = document.getElementById('sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                const openBtn = document.getElementById('open-sidebar');
                if (sidebar) sidebar.classList.add('-translate-x-full');
                if (backdrop) backdrop.classList.add('hidden');
                if (openBtn) openBtn.setAttribute('aria-expanded', 'false');
            }
        }

        /**
         * 5. APPLICATION CONTROLLER
         */
        class App {
            constructor() {
                this.state = new AppState();
                const rootElement = document.getElementById('app-root');
                this.router = new Router(rootElement, this.state);
                
                this.initUIEvents();
                
                if (!window.location.hash) {
                    window.location.hash = '#home';
                } else {
                    this.router.navigate();
                }
                
                this.state.notifyUI();
            }

            submitTest(moduleId, correctIndex) {
                const radios = document.querySelectorAll('input[name="test-quiz"]');
                let selected = -1;
                radios.forEach((r, idx) => { if (r.checked) selected = idx; });

                const feedback = document.getElementById('test-feedback');
                feedback.classList.remove('hidden');

                if (selected === -1) {
                    feedback.className = 'mb-4 p-4 rounded-xl text-sm font-bold bg-amber-100 text-amber-900';
                    feedback.innerText = '⚠️ Будь ласка, оберіть один із варіантів відповіді.';
                    return;
                }

                if (selected === correctIndex) {
                    feedback.className = 'mb-4 p-4 rounded-xl text-sm font-bold bg-green-100 text-green-900';
                    feedback.innerText = '✅ Вірно! Тест складено успішно. Модуль зараховано.';
                    this.state.completeModule(moduleId, 100);
                    setTimeout(() => {
                        window.location.hash = '#training';
                    }, 1200);
                } else {
                    feedback.className = 'mb-4 p-4 rounded-xl text-sm font-bold bg-red-100 text-red-900';
                    feedback.innerText = '❌ Неправильна відповідь. Уважно перечитайте теорію та спробуйте ще раз.';
                }
            }

            submitCaseTest() {
                const radios = document.querySelectorAll('input[name="case-quiz"]');
                let isCorrect = false;
                let selected = false;
                radios.forEach(r => {
                    if (r.checked) {
                        selected = true;
                        if (r.value === 'true') isCorrect = true;
                    }
                });

                const feedback = document.getElementById('case-feedback');
                feedback.classList.remove('hidden');

                if (!selected) {
                    feedback.className = 'mb-3 p-3 rounded-xl text-sm font-bold bg-amber-100 text-amber-900';
                    feedback.innerText = '⚠️ Будь ласка, оберіть варіант дії.';
                    return;
                }

                if (isCorrect) {
                    feedback.className = 'mb-3 p-3 rounded-xl text-sm font-bold bg-green-100 text-green-900';
                    feedback.innerText = '✅ Чудово! Це правильний алгоритм згідно з інструкцією підприємства.';
                } else {
                    feedback.className = 'mb-3 p-3 rounded-xl text-sm font-bold bg-red-100 text-red-900';
                    feedback.innerText = '❌ Помилка. Порушення регламенту вхідного контролю!';
                }
            }

            resetProgressModal() {
                if (confirm('Ви дійсно хочете скинути весь свій прогрес навчання?')) {
                    this.state.resetProgress();
                    alert('Прогрес успішно скинуто.');
                    window.location.hash = '#home';
                }
            }

            filterTransactions() {
                const query = document.getElementById('tx-search').value.toLowerCase().trim();
                const cards = document.querySelectorAll('.tx-card');
                cards.forEach(card => {
                    const searchData = card.dataset.search;
                    if (searchData.includes(query)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            setTxCategory(cat) {
                document.querySelectorAll('.tx-filter-btn').forEach(btn => {
                    btn.className = 'tx-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
                });
                event.target.className = 'tx-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition';

                const cards = document.querySelectorAll('.tx-card');
                cards.forEach(card => {
                    if (cat === 'all' || card.dataset.category === cat) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            initUIEvents() {
                const sidebar = document.getElementById('sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                const openBtn = document.getElementById('open-sidebar');
                const closeBtn = document.getElementById('close-sidebar');

                const toggleMenu = () => {
                    const isOpen = !sidebar.classList.contains('-translate-x-full');
                    sidebar.classList.toggle('-translate-x-full');
                    backdrop.classList.toggle('hidden');
                    openBtn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
                };

                if (openBtn) openBtn.addEventListener('click', toggleMenu);
                if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
                if (backdrop) backdrop.addEventListener('click', toggleMenu);

                // Accessibility: Close sidebar on Escape key
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        sidebar.classList.add('-translate-x-full');
                        backdrop.classList.add('hidden');
                        if (openBtn) openBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        }

        // Bootstrap App
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
