                    content: `
                        <p class="mb-4">Для того, щоб успішно працювати в системі SAP та з фізичними замовленнями, необхідно розуміти, як кодуються різні типи матеріалів, орієнтуватися в кодах локацій (заводів та підскладів), а також знати, як правильно читати супровідний документ.</p>
                        
                        <h3 class="text-xl font-bold text-slate-900 pt-6 pb-2 border-b border-slate-200 mb-4">1. Типи матеріалів (Кодування артикулів)</h3>
                        <p class="mb-2">Кожен матеріал має свій унікальний код (артикул). Перша цифра артикулу вказує на тип матеріалу та його походження:</p>

                            <li><strong class="text-blue-700">3******</strong> (цифра 3 + 6 цифр) — <strong>Крій з рулонних матеріалів.</strong> Деталі, які вже викроєні на катері з сировини групи 8*.</li>
                            <li><strong class="text-blue-700">4******</strong> (цифра 4 + 6 цифр) — <strong>Крій зі шкіри.</strong> Деталі, викроєні на розкрійному комплексі з сировини групи 1* або 2*.</li>
                            <li><strong class="text-blue-700">5******</strong> (цифра 5 + 6 цифр) — <strong>Готове замовлення (комплект).</strong> Фінальний продукт, який ми складаємо з усіх попередніх артикулів.</li>

                        <h3 class="text-xl font-bold text-slate-900 pt-6 pb-2 border-b border-slate-200 mb-4">2. Заводи та підсклади (Де знаходиться матеріал?)</h3>

                            <li><strong>BPA1</strong> — Підсклад приймання для сировини 8* та B-Parts.</li>

                            <li><strong class="text-blue-600 font-mono text-lg">1</strong> — <strong>Поверх:</strong> на якому поверсі знаходиться стелаж.</li>
                            <li><strong class="text-blue-600 font-mono text-lg">H</strong> — <strong>Ряд:</strong> літера ряду (алеї) між стелажами.</li>

                            <li><strong class="text-blue-600 font-mono text-lg">01</strong> — <strong>Комірка:</strong> порядковий номер місця на полиці.</li>
                            <li><strong class="text-blue-600 font-mono text-lg">A</strong> — <strong>Код складу:</strong> основний склад на заводі.</li>

                {

                    content: `
                        <p class="mb-4"><strong>ZEBWM</strong> слугує головним пультом управління для аналізу стану складу, пошуку матеріалів, а також для дій резервування, коригування, блокування та управління складомісцями.</p>
                        
                        <h3 class="text-xl font-bold text-slate-900 pt-4 pb-2 border-b border-slate-200 mb-4">1. Запуск та Головне меню</h3>

                            <li>Введіть <span class="lms-kbd">ZEBWM</span> у верхнє командне поле та натисніть Enter.</li>
                            <li>Введіть базові дані: <strong>Werk</strong> (Завод, напр. 0323) та <strong>Lagerort</strong> (Підсклад, напр. WM01).</li>
                            <li>Натисніть <span class="lms-kbd">F8</span> (або кнопку ✅ "Виконати").</li>
                        </ol>

                        <p class="mb-2">Відкриється дашборд із кнопками. Для щоденної роботи знадобляться лише перші два стовпці:</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <strong class="block text-slate-900 mb-2 text-lg">Стовпець 1: Аналітика (Перегляд)</strong>
                                <ul class="text-sm space-y-2">
                                    <li><strong>Lagerbestand:</strong> Фактична наявність. Що і де лежить.</li>

                                    <li><strong>Abgleich Lagerbestand:</strong> Різниці / Незбіжності (пошук згуб).</li>
                                    <li><strong>Auftrag prüfen:</strong> Прийнято, але ще не встановлено на полицю.</li>

                                <ul class="text-sm space-y-2">

                        <h3 class="text-xl font-bold text-slate-900 pt-4 pb-2 border-b border-slate-200 mb-4">2. Екран пошуку (Фільтри)</h3>
                        <p class="mb-4">Натиснувши будь-яку кнопку (напр. Lagerbestand), відкриється вікно фільтрів. Заповнюйте лише те, що шукаєте:</p>
                        <ul class="list-disc pl-5 space-y-2 mb-6">
                            <li><strong>Lagerplatz:</strong> Адреса (напр. 1H101A). <em>Лайфхак: використання зірочки (*) дозволяє шукати масово, напр. <span class="lms-kbd">1*A</span> покаже весь перший поверх.</em></li>

                                    <td>Матеріал вільний</td>

        /**
         * STATE LAYER (Handles localStorage and reactive updates)
         */
        class AppState {
            constructor() {
                this.storageKey = 'sap_storage_lms_v3';
                this.progress = this.loadProgress();
            }

            loadProgress() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : {};
                } catch (e) {
                    return {};
                }
            }

            saveProgress() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.progress));
                this.notifyUI();
            }

            completeModule(moduleId) {
                this.progress[moduleId] = true;
                this.saveProgress();
            }

            isModuleCompleted(moduleId) {
                return !!this.progress[moduleId];
            }

            getProgressPercentage() {
                const total = AppData.modules.length;
                if (total === 0) return 0;
                const completed = Object.keys(this.progress).length;
                return Math.min(Math.round((completed / total) * 100), 100);
            }

            notifyUI() {
                const percent = this.getProgressPercentage();
                document.getElementById('progress-text').innerText = `${percent}%`;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            }
        }

        /**
         * ROUTER LAYER (Handles URL hashes and view swapping)
         */
        class Router {
            constructor(rootElement, stateManager) {
                this.root = rootElement;
                this.state = stateManager;
                
                this.routes = [
                    { path: /^#home$/, render: () => Components.Home() },
                    { path: /^#training$/, render: () => Components.Training(this.state) },
                    { path: /^#directory$/, render: () => Components.Directory() },
                    { path: /^#procedures$/, render: () => Components.ProceduresList() },
                    { 
                        path: /^#sap\/([a-z0-9_]+)$/, 
                        render: (matches) => {
                            const module = AppData.modules.find(m => m.id === matches[1]);
                            return module ? Components.ModuleDetail(module, this.state) : Components.NotFound();
                        }
                    },
                    { 
                        path: /^#procedures\/([a-z0-9_]+)$/, 
                        render: (matches) => {
                            const proc = AppData.procedures.find(p => p.id === matches[1]);
                            return proc ? Components.ProcedureDetail(proc) : Components.NotFound();
                        }
                    }
                ];

                window.addEventListener('hashchange', () => this.navigate());
            }

            navigate() {
                const hash = window.location.hash || '#home';
                let matched = false;

                this.updateActiveNav(hash);

                for (let route of this.routes) {
                    const match = hash.match(route.path);
                    if (match) {
                        this.root.innerHTML = route.render(match);
                        matched = true;
                        break;
                    }
                }

                if (!matched) {
                    this.root.innerHTML = Components.NotFound();
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.closeMobileSidebar();
            }

            updateActiveNav(hash) {
                const baseRoute = hash.split('/')[0].replace('#', '');
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.dataset.path === baseRoute) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }

            closeMobileSidebar() {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-backdrop').classList.add('hidden');
            }
        }

        /**
         * APPLICATION CONTROLLER
         */
        class App {
            constructor() {
                this.state = new AppState();
                const rootElement = document.getElementById('app-root');
                this.router = new Router(rootElement, this.state);
                
                this.initUIEvents();
                
                if (!window.location.hash) {
                    window.location.hash = '#home';
                } else {
                    this.router.navigate();
                }
                
                this.state.notifyUI();
            }

            completeModule(moduleId) {
                this.state.completeModule(moduleId);
                window.location.hash = '#training';
            }

            initUIEvents() {
                const sidebar = document.getElementById('sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                
                const toggleMenu = () => {
                    sidebar.classList.toggle('-translate-x-full');
                    backdrop.classList.toggle('hidden');
                };

                document.getElementById('open-sidebar').addEventListener('click', toggleMenu);
                document.getElementById('close-sidebar').addEventListener('click', toggleMenu);
                backdrop.addEventListener('click', toggleMenu);
            }
        }

        // Bootstrap
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
