<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP Storage — Навчальний портал</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-bg: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--app-bg);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        .page-enter {
            animation: slideFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes slideFadeIn { 
            from { opacity: 0; transform: translateY(12px) scale(0.99); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        
        /* Active Nav State */
        .nav-link.active {
            background-color: #eff6ff;
            color: #2563eb;
        }
    </style>
</head>
<body class="text-slate-900 flex h-screen overflow-hidden">

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Sidebar Layout -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-white border-r border-slate-200 flex flex-col z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none flex-shrink-0">
        <div class="p-6 md:p-8 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.hash='#home'">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-200">S</div>
                <div>
                    <span class="font-extrabold text-xl text-slate-900 block leading-none">Storage</span>
                    <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1 block">LMS Portal</span>
                </div>
            </div>
            <button id="close-sidebar" class="md:hidden p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-1.5 overflow-y-auto" id="main-nav">
            <a href="#home" class="nav-link flex items-center px-4 py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition" data-path="home">🏠 Головна</a>
            <a href="#training" class="nav-link flex items-center px-4 py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition" data-path="training">📚 Навчання</a>
            <a href="#directory" class="nav-link flex items-center px-4 py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition" data-path="directory">🔍 Довідник</a>
            <a href="#procedures" class="nav-link flex items-center px-4 py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition" data-path="procedures">🧪 Порядки роботи</a>
            
            <div class="pt-4 mt-4 border-t border-slate-100">
                <a href="https://tbuchak-sudo.github.io/fishnet/" target="_blank" class="flex items-center px-4 py-3 rounded-xl font-semibold text-slate-600 hover:bg-green-50 hover:text-green-700 transition">
                    💰 Калькулятор зарплати
                    <svg class="w-4 h-4 ml-auto opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
        </nav>

        <div class="p-5 m-4 bg-slate-50 rounded-2xl border border-slate-200">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">Прогрес навчання</span>
                <span id="progress-text" class="text-sm font-bold text-blue-700">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-blue-600 h-full rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-slate-50/50">
        <!-- Mobile Header Bar -->
        <header class="md:hidden bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between z-20 flex-shrink-0">
            <button id="open-sidebar" class="p-2 text-slate-700 hover:bg-slate-100 rounded-lg transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <span class="font-extrabold text-lg text-slate-900 tracking-tight">SAP Storage</span>
            <div class="w-8"></div>
        </header>

        <!-- Dynamic Content Mount Point -->
        <div id="app-root" class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-12 pb-24">
            <!-- Content gets injected here by app.js -->
        </div>
    </main>

    <!-- Завантажуємо наші скрипти: спочатку Дані, потім Логіку -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
